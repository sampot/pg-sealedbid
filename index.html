<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2d1b35"><meta name="description" content="與 2–3 位電腦買家同時密封出價，競標收藏品並累積價值。"><title>密封拍賣</title><link rel="stylesheet" href="./styles.css"></head>
<body><main><header><p class="eyebrow">桌遊系列</p><h1>密封拍賣</h1><p>與 2–3 位電腦買家同時密封出價，競標收藏品並累積價值。</p></header><section class="hud"><span>目前分數 <b id="score">0</b></span><span id="extra">準備中</span><span>最高紀錄 <b id="best">0</b></span></section><p id="status" role="status">準備開始</p><section class="auction"><p class="lot">第 <b id="round">1</b> 輪</p><div id="item" class="item"></div><label class="bid">你的密封出價 <input id="bid" type="number" min="0" inputmode="numeric" value="25"></label><button id="submit">封標並揭曉</button><div id="reveal" class="reveal"></div></section><section><h2>競標者</h2><div id="players" class="players"></div><button id="new">新拍賣</button></section><details><summary>遊戲說明</summary><p>與 2–3 位電腦買家同時密封出價，競標收藏品並累積價值。</p><p>最高紀錄會同步至 Playgrounds；離線時仍會保存在此裝置。</p></details><footer>素材與授權詳見 ATTRIBUTION.md</footer></main><script type="module" src="./app.js"></script></body></html>
